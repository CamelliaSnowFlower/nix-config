# Non-destructive checks only: no deploys, no disk or pool operations, no
# access to Google Drive or any secrets, and no service restarts.
name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y imagemagick python3-numpy python3-pil shellcheck
      - name: Run checks
        run: ./scripts/check.sh
